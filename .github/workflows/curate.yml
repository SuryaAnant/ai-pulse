name: Daily AI Pulse curation

on:
  schedule:
    - cron: "0 2 * * *" # 02:00 UTC = 07:30 IST
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  curate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install feedparser anthropic

      - name: Run curator
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python curator.py

      - name: Commit updated briefing
        run: |
          git config user.name "ai-pulse-bot"
          git config user.email "actions@github.com"
          git add data/
          git diff --cached --quiet || git commit -m "Daily briefing $(date -u +%F)"
          git push
