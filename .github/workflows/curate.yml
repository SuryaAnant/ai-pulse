name: Daily AI Pulse curation

# The Mac's 07:30 launchd job is the daily source of truth (it runs enriched on
# the local Claude Code login and pushes). This workflow is a manual fallback —
# trigger it from the Actions tab if the Mac is off; needs ANTHROPIC_API_KEY secret.
on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  curate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install feedparser anthropic

      - name: Run curator
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python curator.py

      - name: Commit updated briefing
        run: |
          git config user.name "ai-pulse-bot"
          git config user.email "actions@github.com"
          git add data/
          git diff --cached --quiet || git commit -m "Daily briefing $(date -u +%F)"
          git push
